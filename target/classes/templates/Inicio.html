<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tuned Hive</title>
  <!-- Usar la ruta que Spring Boot sirve desde / y Thymeleaf para resolverla correctamente -->
  <link rel="stylesheet" th:href="@{/estilos.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <button class="btn-colmena info info-top-left" onclick="window.location.href='/Información'">Más información</button>
    <div class="eslogan eslogan-top-right">Hone-y your music!</div>
    <div class="logo-contenedor" style="position: relative; display: inline-block;">
      <div class="abeja-voladora" id="abeja-voladora" aria-hidden="true">
        <!-- SVG de abeja ligera -->
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="24" cy="32" rx="10" ry="6" fill="#f6e27a" stroke="#bfa14a" stroke-width="2"/>
          <ellipse cx="24" cy="32" rx="5" ry="3" fill="#3a2a13" opacity=".18"/>
          <ellipse cx="18" cy="28" rx="4" ry="8" fill="#fff" fill-opacity=".7" stroke="#bfa14a" stroke-width="1.2"/>
          <ellipse cx="30" cy="28" rx="4" ry="8" fill="#fff" fill-opacity=".7" stroke="#bfa14a" stroke-width="1.2"/>
          <ellipse cx="24" cy="32" rx="8" ry="6" fill="#e2a84a" stroke="#bfa14a" stroke-width="2"/>
          <ellipse cx="24" cy="32" rx="2.5" ry="6" fill="#3a2a13"/>
          <circle cx="24" cy="22" r="5" fill="#3a2a13" stroke="#bfa14a" stroke-width="2"/>
          <ellipse cx="22.5" cy="21" rx="1.2" ry="2" fill="#fff" fill-opacity=".7"/>
          <ellipse cx="25.5" cy="23" rx="0.7" ry="1.1" fill="#fff" fill-opacity=".7"/>
          <ellipse cx="20" cy="18" rx="1.5" ry="0.5" fill="#bfa14a"/>
          <ellipse cx="28" cy="18" rx="1.5" ry="0.5" fill="#bfa14a"/>
        </svg>
      </div>
      <!-- Usar Thymeleaf para resolver la ruta de la imagen estática -->
      <img th:src="@{/TunedHive.png}" alt="Logo TunedHive" class="logo-colmena" id="logo-colmena">
    </div>
    <div class="icono-musica">
      <i class="fas fa-music"></i>
    </div>
    <div class="botones-colmena" style="margin-bottom: 1.5em;">
      <button class="btn-colmena login" onclick="window.location.href='/users/login'">Iniciar sesión</button>
      <button class="btn-colmena registro" onclick="window.location.href='/users/register'">Registrarse</button>
    </div>
    <h1>Tuned Hive</h1>
    <div class="subtitulo">
      Plataforma colaborativa para amantes de la música
    </div>
    <script>
    // Animación de la abeja al pulsar el logo
    const logo = document.getElementById('logo-colmena');
    const abeja = document.getElementById('abeja-voladora');
    logo.addEventListener('click', () => {
      if (abeja.classList.contains('volando')) return;
      abeja.classList.add('volando');
      abeja.addEventListener('animationend', () => {
        abeja.classList.remove('volando');
      }, { once: true });
    });
    </script>
</body>
</html>
