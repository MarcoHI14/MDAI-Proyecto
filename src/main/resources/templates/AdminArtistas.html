<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Administrar Artistas | Tuned Hive</title>
  <!-- Usar los mismos estilos compartidos que las vistas admin -->
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/landing.css(v=8)}" />
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}" />
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />

  <style>
    /* Overrides admin: eliminar overlays y asegurar tarjetas opacas */
    .hive-hex::after, .hive-hex::before { display: none !important; }
    .admin-panel-card, .card.admin-panel-card {
      background-color: #ffffff !important;
      opacity: 1 !important;
      box-shadow: 0 12px 30px rgba(20,20,40,0.08) !important;
      border: 1px solid rgba(0,0,0,0.04) !important;
    }
    .admin-hive{ background: transparent !important; background-image: none !important; filter: none !important; }
    .admin-hive::before, .admin-hive::after{ display: none !important; }

    /* Tabla admin: estilo coherente con AdminEstadisticas */
    .admin-table{ width:100%; }
    .admin-table thead th{ color:#6b3e13; font-weight:700; border-bottom: none; }
    .admin-table tbody td{ vertical-align: middle; }

    .empty-msg{ padding:1rem; background:#fffbe6; border-radius:8px; color:#bfa14a; font-weight:700; text-align:center; }

    /* Responsive tweaks */
    @media (max-width: 768px){
      .admin-canciones-deco{ display:none; }
    }

    /* Centrar y agrandar imágenes laterales para aprovechar espacios blancos */
    .admin-canciones-deco{ display:flex; align-items:center; justify-content:center; padding:1.25rem; }
    /* Margen extra para la imagen izquierda respecto a la tabla central */
    .admin-canciones-deco.left{ padding-right:10rem; }
    .admin-canciones-deco img{
      max-width:320px; /* aumentado a 320px */
      max-height:320px;
      width:auto; /* preservar ratio */
      height:auto;
      object-fit:contain;
      display:block;
      transition: transform .18s ease, opacity .18s ease;
    }
    .admin-canciones-deco img:hover{ transform: scale(1.03); opacity:0.98; }

    /* Más separación entre columnas: padding lateral en la columna central aumentado */
    .admin-main-col{ padding-left:3rem; padding-right:3rem; }
    @media (max-width: 991.98px){ .admin-main-col{ padding-left:0.5rem; padding-right:0.5rem; } }
  </style>
</head>
<body>
  <!-- Header común (fragment) -->
  <div th:replace="fragments/admin_header :: adminHeader"></div>

  <!-- Main: layout admin consistente -->
  <main class="container-fluid mt-5 admin-root" style="margin-top:5.5rem;">
    <div class="container" style="max-width:1100px; margin-top:1.5rem;">
      <div class="row gx-4 align-items-start">
        <div class="col-12 col-lg-2 admin-canciones-deco left" aria-hidden="true">
          <img th:src="@{/musico1.png}" alt="decoracion izquierda" loading="lazy">
        </div>

        <div class="col-12 col-lg-8 admin-main-col">
          <div class="card admin-panel-card h-100 bg-white text-dark border shadow-sm rounded-3">
            <div class="card-body" style="background:#fffbe6;">
              <h2 class="mb-3"><i class="fas fa-microphone me-2 text-warning"></i>Administrar Artistas</h2>
              <p class="mb-3 text-dark">Listado de artistas registrados. Puedes eliminar artistas desde aquí.</p>

              <div class="mb-3">
                <div class="d-flex align-items-center gap-2">
                  <input id="filtro-artista" type="text" aria-label="Filtrar por usuario" placeholder="Filtrar por usuario" class="form-control form-control-sm" style="max-width:320px; background:#fffdf6; border:1px solid #e2d3a0;" />
                  <button id="btn-filtrar-artistas" class="btn btn-outline-secondary btn-sm">Filtrar</button>
                </div>

                <div class="d-flex align-items-center gap-2 mt-2">
                  <label for="sort-select-artistas" class="mb-0" style="color:#3a2a13; font-weight:600;">Ordenar por:</label>
                  <select id="sort-select-artistas" class="form-select form-select-sm" style="max-width:180px; background:#fffdf6; border:1px solid #e2d3a0;">
                    <option value="">-- seleccionar --</option>
                    <option value="usuario">Usuario</option>
                    <option value="num">Nº Canciones</option>
                  </select>
                  <button id="btn-sort-artistas" class="btn btn-outline-secondary btn-sm">Ordenar</button>
                  <button id="btn-sort-toggle-artistas" class="btn btn-outline-secondary btn-sm" title="Alternar asc/desc">↑↓</button>
                </div>
              </div>

              <div class="table-responsive">
                <table id="admin-artistas-table" class="table table-borderless admin-table mb-0" th:if="${artistas != null and !#lists.isEmpty(artistas)}">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th data-sortable="usuario">Usuario</th>
                      <th>Biografía</th>
                      <th data-sortable="num">Nº Canciones</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="a : ${artistas}">
                      <td th:text="${a.idArtista}">1</td>
                      <td th:text="${a.usuario != null ? a.usuario.username : 'Usuario'}">usuario</td>
                      <td style="max-width:420px; white-space:normal; word-wrap:break-word;" th:text="${a.biografia}">Biografía corta...</td>
                      <td th:text="${a.canciones != null ? a.canciones.size() : 0}">0</td>
                      <td>
                        <form th:action="@{/admin/AdminArtistas/{id}/delete(id=${a.idArtista})}" method="post" style="display:inline-block;">
                          <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                          <button type="submit" class="btn btn-danger btn-sm"><i class="fas fa-trash me-1"></i>Eliminar</button>
                        </form>
                      </td>
                    </tr>
                  </tbody>
                </table>

                <div th:if="${artistas == null or #lists.isEmpty(artistas)}" class="empty-msg mt-3">No hay artistas.</div>
              </div>

            </div>
          </div>
        </div>

        <div class="col-12 col-lg-2 admin-canciones-deco right d-none d-lg-block" aria-hidden="true">
          <img th:src="@{/cantante1.png}" alt="decoracion derecha" loading="lazy">
        </div>
      </div>
    </div>
  </main>

  <!-- Footer común -->
  <footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
      <p class="mb-1">© Tuned Hive 2025</p>
      <small class="text-muted">20 samples incluidos en /samples</small>
    </div>
  </footer>

  <!-- Scripts: mantengo la lógica JS de antes con small tweaks -->
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      // Toast helper
      const toastContainerId = 'admin-artistas-toast-container';
      let toastContainer = document.getElementById(toastContainerId);
      if (!toastContainer) {
        toastContainer = document.createElement('div');
        toastContainer.id = toastContainerId;
        toastContainer.style.position = 'fixed';
        toastContainer.style.bottom = '1rem';
        toastContainer.style.right = '1rem';
        document.body.appendChild(toastContainer);
      }
      function showToast(type, message, timeout=2500) {
        const el = document.createElement('div');
        el.className = 'admin-canciones-toast ' + (type || 'info');
        el.innerHTML = '<span>' + (message || '') + '</span>';
        toastContainer.appendChild(el);
        requestAnimationFrame(()=> el.classList.add('show'));
        const tid = setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>{ try{ toastContainer.removeChild(el);}catch(e){} },260); }, timeout);
        el.addEventListener('click', ()=>{ clearTimeout(tid); el.classList.remove('show'); setTimeout(()=>{ try{ toastContainer.removeChild(el);}catch(e){} },260); });
      }

      // CSRF helper
      const csrfMeta = document.querySelector('meta[name="_csrf"]');
      const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
      const CSRF = csrfMeta ? { header: (csrfHeaderMeta ? csrfHeaderMeta.content : 'X-CSRF-TOKEN'), token: csrfMeta.content } : null;
      function addCsrf(headers) { if (CSRF && CSRF.token) headers[CSRF.header] = CSRF.token; return headers; }

      // DELETE via API for each row (intercept forms)
      document.querySelectorAll('form').forEach(form => {
        if (form.querySelector('.btn-danger')) {
          form.addEventListener('submit', function(ev){
            ev.preventDefault();
            const tr = form.closest('tr');
            const id = tr.querySelector('td:nth-child(1)').innerText.trim();
            const headers = addCsrf({ 'Accept':'application/json', 'Content-Type':'application/json' });
            fetch(`/admin/api/artistas/${id}`, { method: 'DELETE', headers: headers })
              .then(r=>r.json()).then(data=>{
                if (data && data.status === 'deleted') {
                  tr.remove();
                  showToast('success', 'Artista eliminado');
                } else {
                  showToast('error', data && data.error ? data.error : 'Error eliminando artista');
                }
              }).catch(err=>{ console.error(err); showToast('error', 'Error eliminando artista'); });
          });
        }
      });

      // Sorting + filtering for artistas table
      let sortAscendingArt = true;
      function getText(tr, selector) { const td = tr.querySelector(selector); return td ? td.innerText.trim() : ''; }
      function sortArtBy(key) {
        const tbody = document.querySelector('#admin-artistas-table tbody');
        if (!tbody) return;
        const rows = Array.from(tbody.querySelectorAll('tr'));
        let comp;
        if (key === 'usuario') {
          comp = (a,b) => getText(a, 'td:nth-child(2)').localeCompare(getText(b, 'td:nth-child(2)'), undefined, {sensitivity:'base'});
        } else if (key === 'num') {
          comp = (a,b) => (parseInt(getText(a, 'td:nth-child(4)')||0) - parseInt(getText(b, 'td:nth-child(4)')||0));
        } else return;
        rows.sort((a,b)=> sortAscendingArt ? comp(a,b) : comp(b,a));
        rows.forEach(r=> tbody.appendChild(r));
      }

      // Hook headers clicks
      document.querySelectorAll('th[data-sortable]').forEach(th=>{
        th.addEventListener('click', function(){ const key = th.getAttribute('data-sortable'); sortArtBy(key); sortAscendingArt = !sortAscendingArt; showToast('info', 'Orden: ' + (sortAscendingArt ? 'Ascendente' : 'Descendente')); });
      });

      // Buttons
      const btnSortArt = document.getElementById('btn-sort-artistas');
      const btnSortToggleArt = document.getElementById('btn-sort-toggle-artistas');
      const sortSelectArt = document.getElementById('sort-select-artistas');
      if (btnSortArt) btnSortArt.addEventListener('click', function(){ const sel = sortSelectArt.value; if (!sel) { showToast('error', 'Selecciona primero un criterio de orden'); return; } sortArtBy(sel); showToast('success', 'Orden aplicado'); });
      if (btnSortToggleArt) btnSortToggleArt.addEventListener('click', function(){ sortAscendingArt = !sortAscendingArt; showToast('info', 'Orden: ' + (sortAscendingArt ? 'Ascendente' : 'Descendente')); });

      // Filtering
      const btnFiltrarArt = document.getElementById('btn-filtrar-artistas');
      if (btnFiltrarArt) {
        btnFiltrarArt.addEventListener('click', function(){
          const q = document.getElementById('filtro-artista').value.trim().toLowerCase();
          let visible = 0;
          document.querySelectorAll('#admin-artistas-table tbody tr').forEach(tr=>{
            const usr = (tr.querySelector('td:nth-child(2)') || {innerText:''}).innerText.trim().toLowerCase();
            const show = usr.includes(q);
            tr.style.display = show ? '' : 'none';
            if (show) visible++;
          });
          showToast('info', 'Resultados filtrados: ' + visible);
        });
      }

    });
  </script>

  <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
