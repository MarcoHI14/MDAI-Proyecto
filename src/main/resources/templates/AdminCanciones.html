<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Administrar Canciones | Tuned Hive</title>
  <!-- estilos compartidos (Bootstrap + landing + fontawesome) -->
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/landing.css(v=8)}" />
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}" />
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />

  <style>
    /* Overrides admin: asegurar tarjetas opacas y tablas coherentes */
    .hive-hex::after, .hive-hex::before { display: none !important; }
    .admin-panel-card, .card.admin-panel-card {
      background-color: #ffffff !important;
      opacity: 1 !important;
      box-shadow: 0 12px 30px rgba(20,20,40,0.08) !important;
      border: 1px solid rgba(0,0,0,0.04) !important;
    }
    .admin-hive{ background: transparent !important; background-image: none !important; filter: none !important; }
    .admin-hive::before, .admin-hive::after{ display: none !important; }

    /* Tabla admin: estilo SunMusic coherente */
    .admin-table{ width:100%; }
    .admin-table thead th{ color:#6b3e13; font-weight:700; border-bottom: none; }
    .admin-table tbody td{ vertical-align: middle; }

    .empty-msg{ padding:1rem; background:#fffbe6; border-radius:8px; color:#bfa14a; font-weight:700; text-align:center; }

    /* Centrar y agrandar imágenes laterales */
    .admin-canciones-deco{ display:flex; align-items:center; justify-content:center; padding:1.25rem; }
    .admin-canciones-deco img{
      max-width:320px;
      max-height:320px;
      width:auto;
      height:auto;
      object-fit:contain;
      display:block;
      transition: transform .18s ease, opacity .18s ease;
    }
    .admin-canciones-deco img:hover{ transform: scale(1.03); opacity:0.98; }
    @media (max-width:768px){ .admin-canciones-deco{ display:none; } }

    /* Margen lateral para la columna central */
    .admin-main-col{ padding-left:2rem; padding-right:2rem; }
    /* Card body compacto */
    .admin-panel-card .card-body{ padding:0.75rem; }
    /* Limitar la altura de la tabla y hacer scrolling interno si hace falta (menor espacio para obligar scroll interno) */
    .table-responsive{ max-height: calc(100vh - 8rem); overflow:auto; }

    /* Compactar filas de las tablas admin (menos padding) */
    .admin-table th, .admin-table td { padding: .35rem .5rem; }
    .admin-table.table-sm th, .admin-table.table-sm td { padding: .25rem .4rem; }

    @media (max-width: 991.98px){ .admin-main-col{ padding-left:0.5rem; padding-right:0.5rem; } }
  </style>
</head>
<body>
  <!-- Header común (fragment) -->
  <div th:replace="fragments/admin_header :: adminHeader"></div>

  <main style="margin-top: 3.5rem; padding: 0.75rem 1.25rem; max-width: 1600px; margin-left: auto; margin-right: auto;">
    <div class="admin-canciones-wrapper" style="display:flex; gap:1.5rem; align-items:flex-start; justify-content:center;">
      <div class="admin-canciones-deco left" aria-hidden="true">
        <img th:src="@{/musico1.png}" src="../static/musico1.png" alt="decoracion izquierda" loading="lazy">
      </div>

      <div class="admin-canciones-content admin-main-col" style="flex:1 1 720px; max-width:1250px;">
        <div class="card admin-panel-card h-100 bg-white text-dark border shadow-sm rounded-3">
          <div class="card-body" style="background:#fffbe6;">
            <h2 class="mb-3"><i class="fas fa-music me-2 text-warning"></i>Administrar Canciones</h2>
            <p class="mb-3 text-dark">Listado de canciones. Puedes eliminar canciones desde aquí o buscarlas por título.</p>

            <div class="mb-3">
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <label for="filtro-titulo" class="visually-hidden">Filtrar por título</label>
                <input id="filtro-titulo" type="text" aria-label="Filtrar por título" placeholder="Filtrar por título" class="form-control form-control-sm" style="max-width:360px; background:#fffdf6; border:1px solid #e2d3a0;" />
                <button id="btn-filtrar" class="btn btn-outline-secondary btn-sm">Filtrar</button>
              </div>

              <div class="d-flex align-items-center gap-2 mt-2">
                <label for="sort-select" class="mb-0" style="color:#3a2a13; font-weight:600;">Ordenar por:</label>
                <select id="sort-select" class="form-select form-select-sm ms-2" style="max-width:220px; background:#fffdf6; border:1px solid #e2d3a0;">
                  <option value="">-- seleccionar --</option>
                  <option value="artist">Artista</option>
                  <option value="duration">Duración</option>
                  <option value="genre">Género</option>
                </select>
                <button id="btn-sort" class="btn btn-outline-secondary btn-sm">Ordenar</button>
                <button id="btn-sort-toggle" title="Alternar asc/desc" class="btn btn-outline-secondary btn-sm">↑↓</button>
              </div>
            </div>

            <div class="table-responsive" style="margin-top:0.8rem;">
              <table id="admin-canciones-table" class="table table-borderless admin-table mb-0 align-middle" th:if="${canciones != null and !#lists.isEmpty(canciones)}">
             <thead>
               <tr>
                 <th class="col-id">ID</th>
                 <th class="col-title">Título</th>
                 <th class="col-artist" data-sortable="artist" style="cursor:pointer;">Artista</th>
                 <th class="col-genre" data-sortable="genre" style="cursor:pointer;">Género</th>
                 <th class="col-duration" data-sortable="duration" style="cursor:pointer;">Duración</th>
                 <th class="col-actions">Acciones</th>
               </tr>
             </thead>
             <tbody id="admin-canciones-tbody">
               <tr th:each="c : ${canciones}">
                 <td class="col-id" th:text="${c.idCancion}">1</td>
                 <td class="col-title" th:text="${c.titulo}" th:attr="title=${c.titulo}">Título</td>
                 <td class="col-artist" th:text="${c.artista != null ? c.artista.usuario.username : '—'}">Artista</td>
                 <td class="col-genre" th:text="${c.genero}">Género</td>
                 <td class="col-duration" th:text="${c.duracion}">00:00</td>
                 <td>
                   <form th:action="@{/admin/AdminCanciones/{id}/delete(id=${c.idCancion})}" method="post" style="display:inline-block;">
                     <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                     <button type="submit" class="btn btn-danger btn-sm"><i class="fas fa-trash me-1"></i>Eliminar</button>
                   </form>
                 </td>
               </tr>
             </tbody>
              </table>

              <div th:if="${canciones == null or #lists.isEmpty(canciones)}" class="empty-msg">No hay canciones.</div>
            </div>
          </div>
        </div>
       </div>

      <div class="admin-canciones-deco right" aria-hidden="true">
        <img th:src="@{/cantante1.png}" src="../static/cantante1.png" alt="decoracion derecha" loading="lazy">
      </div>
    </div>
  </main>

  <!-- Toast container (namespaced) -->
  <div id="admin-canciones-toast-container" aria-live="polite" style="position:fixed; bottom:1rem; right:1rem; top:auto; left:auto;"></div>

  <script>
  document.addEventListener('DOMContentLoaded', function(){
    // Toast helper (namespaced)
    const toastContainer = document.getElementById('admin-canciones-toast-container');
    function showToast(type, message, timeout=2500) {
      if (!toastContainer) return;
      const el = document.createElement('div');
      el.className = 'admin-canciones-toast ' + (type || 'info');
      el.innerHTML = '<span>' + (message || '') + '</span>';
      toastContainer.appendChild(el);
      // force reflow then show
      requestAnimationFrame(()=> el.classList.add('show'));
      const tid = setTimeout(()=>{
        el.classList.remove('show');
        setTimeout(()=>{ try{ toastContainer.removeChild(el);}catch(e){} }, 260);
      }, timeout);
      // click to dismiss
      el.addEventListener('click', ()=>{ clearTimeout(tid); el.classList.remove('show'); setTimeout(()=>{ try{ toastContainer.removeChild(el);}catch(e){} },260); });
    }

    // Sorting utilities
    let sortAscending = true; // default
    function parseDurationToSeconds(str) {
      if (!str) return 0;
      const parts = String(str).trim().split(':').map(x=>parseInt(x,10));
      if (parts.some(isNaN)) return 0;
      if (parts.length === 1) return parts[0];
      if (parts.length === 2) return parts[0]*60 + parts[1];
      if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
      return 0;
    }

    function getCellText(tr, selector) {
      const td = tr.querySelector(selector);
      return td ? td.innerText.trim() : '';
    }

    function sortTableBy(key) {
      const tbody = document.getElementById('admin-canciones-tbody');
      if (!tbody) return;
      const rows = Array.from(tbody.querySelectorAll('tr'));
      let comparator;
      if (key === 'artist') {
        comparator = (a,b) => getCellText(a, '.col-artist').localeCompare(getCellText(b, '.col-artist'), undefined, {sensitivity:'base'});
      } else if (key === 'genre') {
        comparator = (a,b) => getCellText(a, '.col-genre').localeCompare(getCellText(b, '.col-genre'), undefined, {sensitivity:'base'});
      } else if (key === 'duration') {
        comparator = (a,b) => parseDurationToSeconds(getCellText(a, '.col-duration')) - parseDurationToSeconds(getCellText(b, '.col-duration'));
      } else {
        return;
      }
      rows.sort((a,b) => sortAscending ? comparator(a,b) : comparator(b,a));
      rows.forEach(r => tbody.appendChild(r));
     }

    // Header clicks: make headers sortable and show toast on toggle
    document.querySelectorAll('th[data-sortable]').forEach(th => {
      th.addEventListener('click', function(){
        const key = th.getAttribute('data-sortable');
        sortTableBy(key);
        sortAscending = !sortAscending;
        showToast('info', 'Orden: ' + (sortAscending ? 'Ascendente' : 'Descendente'));
      });
    });

    // CSRF helper
    const csrfMeta = document.querySelector('meta[name="_csrf"]');
    const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
    const CSRF = csrfMeta ? { header: (csrfHeaderMeta ? csrfHeaderMeta.content : 'X-CSRF-TOKEN'), token: csrfMeta.content } : null;
    function addCsrf(headers) { if (CSRF && CSRF.token) headers[CSRF.header] = CSRF.token; return headers; }

    // DELETE via API for each row (intercept forms with delete buttons)
    document.querySelectorAll('form').forEach(form => {
      if (form.querySelector('.btn-danger')) {
        form.addEventListener('submit', function(ev){
          ev.preventDefault();
          const tr = form.closest('tr');
          const id = tr ? tr.querySelector('td:nth-child(1)').innerText.trim() : null;
          if (!id) { showToast('error', 'ID no encontrado'); return; }
          const headers = addCsrf({ 'Accept':'application/json', 'Content-Type':'application/json' });
          fetch(`/admin/api/canciones/${id}`, { method: 'DELETE', headers: headers })
            .then(r => r.json()).then(data=>{
               if (data && data.status === 'deleted') {
                 tr.remove();
                 showToast('success', 'Canción eliminada');
               } else {
                 showToast('error', data && data.error ? data.error : 'Error eliminando canción');
               }
             }).catch(err=>{ console.error(err); showToast('error', 'Error eliminando canción'); });
        });
      }
    });

    // Select + buttons
    const btnSort = document.getElementById('btn-sort');
    const btnSortToggle = document.getElementById('btn-sort-toggle');
    const sortSelect = document.getElementById('sort-select');
    if (btnSort) {
      btnSort.addEventListener('click', function(){
        const sel = sortSelect.value;
        if (!sel) { showToast('error', 'Selecciona primero un criterio de orden'); return; }
        sortTableBy(sel);
        showToast('success', 'Orden aplicado: ' + (sel === 'artist' ? 'Artista' : sel === 'genre' ? 'Género' : 'Duración'));
      });
    }
    if (btnSortToggle) {
      btnSortToggle.addEventListener('click', function(){ sortAscending = !sortAscending; showToast('info', 'Orden: ' + (sortAscending ? 'Ascendente' : 'Descendente')); });
    }

    // Filtering (client-side simple)
    const btnFiltrar = document.getElementById('btn-filtrar');
    if (btnFiltrar) {
      btnFiltrar.addEventListener('click', function(){
        const q = document.getElementById('filtro-titulo').value.trim().toLowerCase();
        let visible = 0;
        document.querySelectorAll('#admin-canciones-table tbody tr').forEach(tr => {
          const titleEl = tr.querySelector('td:nth-child(2)');
          const title = titleEl ? titleEl.innerText.trim().toLowerCase() : '';
          const show = q === '' ? true : title.includes(q);
          tr.style.display = show ? '' : 'none';
          if (show) visible++;
        });
        showToast('info', 'Resultados filtrados: ' + visible);
      });
    }

  }); // end DOMContentLoaded
  </script>
  <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
