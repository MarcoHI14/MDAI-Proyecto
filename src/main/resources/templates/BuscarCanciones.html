<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bienvenida | Tuned Hive</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        html, body {
            overflow-y: scroll;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>
<header style="width: 100vw; min-width: 100vw; max-width: 100vw; display: flex; align-items: center; justify-content: space-between; background: #fffbe6cc; box-shadow: 0 2px 12px #0001; padding: 0.5em 2em 0.5em 1.5em; border-radius: 0; margin: 0; position: fixed; top: 0; left: 0; z-index: 100;">
    <a th:href="@{/home}" style="display: inline-block; line-height: 0;">
        <img th:src="@{/TunedHive.png}" alt="Logo TunedHive" class="logo-colmena" style="width: 60px; height: auto; margin: 0; cursor: pointer;">
    </a>
    <div class="eslogan eslogan-top-right" style="pointer-events: none; position: static; margin: 0; font-size: 1.3em; font-weight: bold; color: #2d2d2d; letter-spacing: 1px;">¡Bienvenido/a a Tuned Hive!</div>
    <div style="display:flex; gap:0.6em; align-items:center;">
        <button class="btn-colmena info" style="margin: 0; position: static;" th:onclick="|window.location.href='@{/Inicio}'|">Cerrar Sesión</button>
    </div>
</header>
<nav class="menu-bar" style="width: 100vw; min-width: 100vw; max-width: 100vw; display: flex; justify-content: center; background: #fffbe6cc; box-shadow: 0 2px 12px #0001; margin: 0; border-radius: 0; position: fixed; top: 64px; left: 0; z-index: 99;">
    <ul style="display: flex; gap: 2.5em; list-style: none; margin: 0; padding: 0.8em 0; font-size: 1.15em; font-weight: 600;">
        <li><a th:href="@{/Buscar}" href="#" style="color: #bfa14a; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#6b3e13'" onmouseout="this.style.color='#bfa14a'">Buscar Música</a></li>
        <li><a th:href="@{/Playlists}" href="#" style="color: #bfa14a; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#6b3e13'" onmouseout="this.style.color='#bfa14a'">Mis Playlist</a></li>
        <li><a th:href="@{/Artistas}" href="#" style="color: #bfa14a; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#6b3e13'" onmouseout="this.style.color='#bfa14a'">Artistas</a></li>
        <li><a th:href="@{/Micuenta}" href="#" style="color: #bfa14a; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#6b3e13'" onmouseout="this.style.color='#bfa14a'">Mi Cuenta</a></li>
    </ul>
</nav>
<main style="margin-top: 140px; padding: 1em; width: 100vw; box-sizing: border-box;">
    <!-- Sección combinada: Búsqueda + Filtros -->
    <section style="margin-bottom: 1.5em;">
        <div style="display: flex; gap: 2.5em; align-items: center;">
            <!-- Barra de Búsqueda (Izquierda) -->
            <form th:action="@{/BuscarCanciones}" method="get" style="display: flex; gap: 1em; align-items: center; flex: 1;">
                <input type="hidden" id="filtroTipo" name="filtroTipo" value="">
                <!-- etiqueta accesible (off-screen) -->
                <label for="searchInput" style="position:absolute; left:-9999px;">Buscar</label>
                <input type="text" id="searchInput" name="query" placeholder="Selecciona un filtro para buscar..." disabled
                       style="flex: 1; padding: 0.8em; border: 2px solid #bfa14a; border-radius: 8px; font-size: 1em; background: #f5f5f5; margin-right: 1.5em;">
                <button type="submit" id="searchBtn" class="btn-colmena" disabled style="padding: 0.8em 2em;">
                    <i class="fas fa-search"></i> Buscar
                </button>
            </form>

            <!-- Toggles de Filtrado (Derecha) -->
            <div style="background: #fffbe6; border: 2px solid #bfa14a; border-radius: 12px; padding: 1em; display: flex; gap: 1em; flex-shrink: 0;">
                <button id="toggleNombre" class="toggle-btn" onclick="activarFiltro('nombre')"
                        style="padding: 0.8em 2em; border: 2px solid #bfa14a; background: white; color: #bfa14a; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s;">
                    <i class="fas fa-font"></i> Por Nombre
                </button>
                <button id="toggleGenero" class="toggle-btn" onclick="activarFiltro('genero')"
                        style="padding: 0.8em 2em; border: 2px solid #bfa14a; background: white; color: #bfa14a; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s;">
                    <i class="fas fa-music"></i> Por Género
                </button>
                <button id="toggleArtista" class="toggle-btn" onclick="activarFiltro('artista')"
                        style="padding: 0.8em 2em; border: 2px solid #bfa14a; background: white; color: #bfa14a; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s;">
                    <i class="fas fa-user"></i> Por Artista
                </button>
            </div>
        </div>
    </section>

    <!-- Lista de Canciones -->
    <section style="background: #fffbe6cc; border-radius: 16px; padding: 1.5em; box-shadow: 0 2px 12px rgba(0,0,0,0.05); min-height: calc(100vh - 180px);">
    <h2 style="color: #2d2d2d; margin-bottom: 1em; text-align: center;" id="tituloResultados">Todas las Canciones</h2>
        <!-- Contenedor a ancho completo para que la tabla ocupe todo el ancho del panel -->
        <div style="width:100%; overflow:auto;">
            <table class="full-table" style="width:100%; border-collapse: collapse;">
                <thead>
                    <tr style="background:#f7f3e6; text-align:left;">
                        <th style="padding:0.75em 1em; border-bottom:1px solid #e6d8a8; width:6%">Orden</th>
                        <th style="padding:0.75em 1em; border-bottom:1px solid #e6d8a8;">Título</th>
                        <th style="padding:0.75em 1em; border-bottom:1px solid #e6d8a8; width:12%">Género</th>
                        <th style="padding:0.75em 1em; border-bottom:1px solid #e6d8a8; width:10%">Duración</th>
                        <th style="padding:0.75em 1em; border-bottom:1px solid #e6d8a8; width:16%">Artista</th>
                        <th style="padding:0.75em 1em; border-bottom:1px solid #e6d8a8; width:14%">Fecha Subida</th>
                        <th style="padding:0.75em 1em; border-bottom:1px solid #e6d8a8; width:8%; text-align:center;">Reproducir</th>
                     </tr>
                 </thead>
                 <tbody>
                    <tr th:each="c, iterStat : ${canciones}" style="border-bottom:1px solid #eee;">
                        <td style="padding:0.8em 1em; vertical-align: middle; text-align:center;" th:text="${iterStat.index + 1}">1</td>
                        <td style="padding:0.8em 1em; vertical-align: middle;" th:text="${c.titulo}">Título</td>
                        <td style="padding:0.8em 1em; vertical-align: middle;" th:text="${c.genero}">Género</td>
                        <td style="padding:0.8em 1em; vertical-align: middle;" th:text="${c.duracion != null ? c.duracion : '—'}">00:00</td>
                        <td style="padding:0.8em 1em; vertical-align: middle;" th:text="${c.artista != null && c.artista.usuario != null ? c.artista.usuario.username : '—'}">Artista</td>
                        <td style="padding:0.8em 1em; vertical-align: middle;" th:text="${c.fechaSubida != null ? (#temporals.format(c.fechaSubida,'dd/MM/yyyy')) : '—'}">Fecha</td>
                        <!-- audio oculto y botón reproducir -->
                        <td style="padding:0.6em 0.8em; vertical-align: middle; text-align:center;">
                            <audio th:id="${'audio-' + c.idCancion}" th:src="@{${c.archivoAudio}}" preload="none" style="display:none;"></audio>
                            <button type="button" class="btn-colmena" th:attr="id=${'btn-play-' + c.idCancion}" th:onclick="|togglePlay(${c.idCancion})|" title="Reproducir">
                                <i class="fas fa-play"></i>
                            </button>
                        </td>
                    </tr>
                 </tbody>
             </table>
         </div>

         <!-- Mensaje cuando no hay resultados -->
         <div th:if="${#lists.isEmpty(canciones)}" style="text-align: center; padding: 3em; color: #999;">
             <i class="fas fa-search" style="font-size: 3em; margin-bottom: 0.5em; color: #bfa14a;"></i>
             <p style="font-size: 1.2em;">No se encontraron canciones</p>
         </div>
     </section>
</main>
<script>
     let filtroActivo = null;

    function activarFiltro(tipo) {
        const toggles = document.querySelectorAll('.toggle-btn');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const filtroTipo = document.getElementById('filtroTipo');
        const tituloResultados = document.getElementById('tituloResultados');

        if (filtroActivo === tipo) {
            filtroActivo = null;
            toggles.forEach(btn => {
                btn.style.background = 'white';
                btn.style.color = '#bfa14a';
            });
            searchInput.disabled = true;
            searchInput.value = '';
            searchInput.placeholder = 'Selecciona un filtro para buscar...';
            searchInput.style.background = '#f5f5f5';
            searchBtn.disabled = true;
            filtroTipo.value = '';
            tituloResultados.textContent = 'Todas las Canciones';
            window.location.href = '/Buscar';
            return;
        }

        filtroActivo = tipo;
        filtroTipo.value = tipo;

        toggles.forEach(btn => {
            btn.style.background = 'white';
            btn.style.color = '#bfa14a';
        });

        const toggleActivo = document.getElementById('toggle' + tipo.charAt(0).toUpperCase() + tipo.slice(1));
        toggleActivo.style.background = '#6b3e13';
        toggleActivo.style.color = 'white';

        searchInput.disabled = false;
        searchInput.style.background = 'white';
        searchBtn.disabled = false;

        switch(tipo) {
            case 'nombre':
                searchInput.placeholder = 'Buscar por nombre de canción...';
                tituloResultados.textContent = 'Búsqueda por Nombre';
                break;
            case 'genero':
                searchInput.placeholder = 'Buscar por género...';
                tituloResultados.textContent = 'Búsqueda por Género';
                break;
            case 'artista':
                searchInput.placeholder = 'Buscar por artista...';
                tituloResultados.textContent = 'Búsqueda por Artista';
                break;
        }
        searchInput.focus();
    }

    // Reproductor por fila: reproduce/pausa y actualiza icono; pausa otros audios
    function togglePlay(id) {
        try {
            const audio = document.getElementById('audio-' + id);
            const btn = document.getElementById('btn-play-' + id);
            if (!audio || !btn) return;

            // Pausar otros audios
            document.querySelectorAll('audio').forEach(a => {
                if (a !== audio) {
                    try { a.pause(); a.currentTime = 0; } catch(e){}
                    const otherId = a.id ? a.id.replace('audio-','') : null;
                    if (otherId) {
                        const otherBtn = document.getElementById('btn-play-' + otherId);
                        if (otherBtn) otherBtn.innerHTML = '<i class="fas fa-play"></i>';
                    }
                }
            });

            if (audio.paused) {
                audio.play().then(()=>{
                    btn.innerHTML = '<i class="fas fa-pause"></i>';
                }).catch(err=>{
                    console.error('No se pudo reproducir:', err);
                });
            } else {
                audio.pause();
                btn.innerHTML = '<i class="fas fa-play"></i>';
            }

            audio.onended = function(){
                if (btn) btn.innerHTML = '<i class="fas fa-play"></i>';
            };
        } catch(e) { console.error('togglePlay error', e); }
    }
</script>

</body>
</html>
