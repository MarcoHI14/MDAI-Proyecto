<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estadísticas Administrador | Tuned Hive</title>
  <!-- Usar las mismas referencias y estilos que BienvenidaAdmin -->
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/landing.css(v=8)}" />
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}" />

  <!-- Overrides específicos para la vista de administración: eliminar overlay blanquecino y asegurar tarjetas opacas -->
  <style>
    .hive-hex::after, .hive-hex::before { display: none !important; }
    .admin-panel-card, .card.admin-panel-card {
      background-color: #ffffff !important;
      opacity: 1 !important;
      box-shadow: 0 12px 30px rgba(20,20,40,0.08) !important;
      border: 1px solid rgba(0,0,0,0.04) !important;
    }
    .admin-hive{ background: transparent !important; background-image: none !important; filter: none !important; }
    .admin-hive::before, .admin-hive::after{ display: none !important; }
  </style>
</head>
<body>
  <!-- Header común (fragment) -->
  <div th:replace="fragments/admin_header :: adminHeader"></div>

  <!-- Main content replicando estructura y estilos de BienvenidaAdmin -->
  <main class="container-fluid mt-5 admin-root" style="margin-top:5.5rem;">
    <div class="row gx-4 justify-content-center">
      <div class="col-12 col-lg-8 mb-4 admin-hero">
        <div class="admin-hive">
          <div class="card admin-panel-card h-100 bg-white text-dark border shadow-sm rounded-3">
            <div class="card-body">
              <h2 class="mb-3"><i class="fas fa-chart-line me-2 text-warning"></i>Estadísticas del sistema</h2>
              <div class="table-responsive">
                <table class="table table-borderless mb-0 align-middle">
                  <tbody>
                    <tr>
                      <th style="width:60%; color:#6b3e13;">Usuarios registrados</th>
                      <td th:text="${totalUsuarios}" style="font-weight:700; color:#2d2d2d;">0</td>
                    </tr>
                    <tr>
                      <th style="color:#6b3e13;">Artistas</th>
                      <td th:text="${totalArtistas}" style="font-weight:700; color:#2d2d2d;">0</td>
                    </tr>
                    <tr>
                      <th style="color:#6b3e13;">Canciones</th>
                      <td th:text="${totalCanciones}" style="font-weight:700; color:#2d2d2d;">0</td>
                    </tr>
                    <tr>
                      <th style="color:#6b3e13;">Playlists</th>
                      <td th:text="${totalPlaylists}" style="font-weight:700; color:#2d2d2d;">0</td>
                    </tr>
                    <tr>
                      <th style="color:#6b3e13;">Solicitudes pendientes</th>
                      <td th:text="${pendientes}" style="font-weight:700; color:#2d2d2d;">0</td>
                    </tr>
                    <tr>
                      <th style="color:#6b3e13;">Solicitudes aprobadas</th>
                      <td th:text="${aprobadas}" style="font-weight:700; color:#2d2d2d;">0</td>
                    </tr>
                    <tr>
                      <th style="color:#6b3e13;">Solicitudes rechazadas</th>
                      <td th:text="${rechazadas}" style="font-weight:700; color:#2d2d2d;">0</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer exacto de BienvenidaAdmin -->
  <footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
      <p class="mb-1">© Tuned Hive 2025</p>
      <small class="text-muted">20 samples incluidos en /samples</small>
    </div>
  </footer>

  <!-- Limpieza mínima de backdrops residuales (igual que BienvenidaAdmin) -->
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      document.querySelectorAll('.modal-backdrop').forEach(function(el){ try{ el.remove(); }catch(e){} });
      document.body.classList.remove('modal-open');
      document.body.style.overflow = '';
    });
  </script>

  <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
